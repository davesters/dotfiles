add_newline = false
format = "$username$directory${custom.git_clean}${custom.git_dirty}${custom.git_unpushed}$cmd_duration$character"

[username]
show_always = true
style_user = "cyan"
format = "[$user]($style) in "

[directory]
style = "bold green"
truncation_length = 0
truncate_to_repo = false
format = "[$path]($style) "

# Branch is green when clean, red with uncommitted/untracked changes.
[custom.git_clean]
require_repo = true
shell = ["sh"]
when = '[ -z "$(git status --porcelain 2>/dev/null)" ]'
command = 'git symbolic-ref --short HEAD 2>/dev/null || git rev-parse --short HEAD'
style = "bold green"
format = "on [$output]($style) "

[custom.git_dirty]
require_repo = true
shell = ["sh"]
when = '[ -n "$(git status --porcelain 2>/dev/null)" ]'
command = 'git symbolic-ref --short HEAD 2>/dev/null || git rev-parse --short HEAD'
style = "bold red"
format = "on [$output]($style) "

[custom.git_unpushed]
require_repo = true
shell = ["sh"]
when = '[ -n "$(git cherry "@{upstream}" 2>/dev/null)" ]'
command = 'echo unpushed'
style = "bold purple"
format = "with [$output]($style) "

[cmd_duration]
format = "took [$duration]($style) "

[character]
success_symbol = "[>](bold)"
error_symbol = "[>](bold red)"
